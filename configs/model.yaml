  - gap_med_exp
  - gap_std_exp
  - gap_mean_rN
  - gap_std_rN
  - gap_cv_exp
  - time_to_med_exp
  - z_to_med_exp
  - time_to_mean_rN
  - z_to_mean_rN
  - div_count_exp
  # A2/A3: 节奏精细化特征
